<div class="card">
    <div class="card-body text-center">
        <h5 class="card-title">
            {{ comment.created_at }}
        </h5>
        <p class="card-text">{{ comment.content }}</p>
        <p class="card-text">Advantages: {{ comment.advantages }}</p>
        <p class="card-text">Disadvantages: {{ comment.disadvantages }}</p>
        <p class="card-text">Rating: {{ comment.rating }}</p>
    </div>
</div>

{% extends 'index.html' %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}
    <div class="m-5">
        <form method="post" style="width: 25em; margin: auto">
            {% csrf_token %}
            {{ form|crispy }}
            <input type="submit" class="btn btn-primary" value="Login">
        </form>
        <div class="d-flex justify-content-center">
            <a class="btn btn-primary-outline" href="{% url "social:begin" "google-oauth2" %}">Google</a>
        </div>
    </div>
{% endblock content %}

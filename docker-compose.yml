version: "3"

services:
  python:
    container_name: python_${PROJECT_NAME}
    build:
      context: ./
      dockerfile: docker/configs/python/Dockerfile
      args:
        WORKDIR: ${WORKDIR}
    ports:
      - "${HTTP_PORT}:8000"
    volumes:
      - ./src:${WORKDIR}/src
      - ./commands:${WORKDIR}/commands
      - ./static:${WORKDIR}/static
      - media_content:${WORKDIR}/media
    env_file: .env
    command: ./commands/start_server_${MODE}.sh
    depends_on:
      - postgres

  postgres:
    container_name: postgres_${PROJECT_NAME}
    image: postgres:16.4
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin_${PROJECT_NAME}
    image: dpage/pgadmin4
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pg_admin:/var/lib/pgadmin
    env_file:
      - .env
    depends_on:
      - postgres
    restart: on-failure

  mongo:
    container_name: mongodb_${PROJECT_NAME}
    image: mongo:7-jammy
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env
    restart: on-failure

  mongo_express:
    container_name: mongo_express_${PROJECT_NAME}
    image: mongo-express:latest
    ports:
      - "${ME_PORT}:8081"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: on-failure


volumes:
  pg_data: {}
  pg_admin: {}
  mongo_data: {}
  media_content: {}